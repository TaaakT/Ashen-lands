ui.innerHTML=tr('<div class="card">'+h+'</div>');ui.style.display='flex';ui.style.background=n==='inv'?'rgba(8,10,14,.94)':'rgba(8,10,14,.4)';document.getElementById('ib').style.display=n==='inv'?'block':'none';prv()}
ui.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset,nm=document.getElementById('nm');if(nm)ch.name=nm.value.replace(/[<>&"']/g,'').trim()||'Безымянный';
if(d.x){toggleInv();return}
if(d.e!==undefined){equip(P.bag[+d.e]);scr('inv');return}
if(d.s!==undefined){sell(P.bag[+d.s]);scr('inv');return}
if(d.q){sell(d.q==='w'?P.wp:P.eq[d.q],1);scr('inv');return}
if(d.l!==undefined){selLv=+d.l;scr('cls');return}
if(d.o){ch[d.o]=+d.i;scr('look');return}
if(d.st){S[d.st]=+d.v;sv();if(d.st==='lg')applyLang();scr('set');return}
if(d.m){state='menu';scr('menu');return}
if(d.c){ch.cls=d.c;ui.style.display='none';if(matchMedia('(pointer:coarse)').matches)goFS();newGame();return}
if(d.a==='cont'){if(loadGame()){ui.style.display='none';if(matchMedia('(pointer:coarse)').matches)goFS()}return}
if(d.a==='back'){scr(bk);return}
if(d.a){if(d.a==='set')bk=state==='inv'?'inv':'menu';if(d.a==='menu'){try{localStorage.setItem('pz_ch',JSON.stringify(ch))}catch(_){}}scr(d.a)}});
ui.addEventListener('input',e=>{if(e.target.id==='vol'){S.vol=e.target.value/100;sv()}});
applyLang();document.getElementById('ib').onclick=toggleInv;document.getElementById('fs').onclick=goFS;
scr('menu');
let last=performance.now();function frame(t){const dt=Math.min(.033,(t-last)/1000);last=t;if(state==='play')update(dt);draw();if((state==='play'||state==='menu')&&S.px)pix(g,W/2,H/2);requestAnimationFrame(frame)}
const PA={};function aimAt(e){const r=cv.getBoundingClientRect(),sc=Math.min(r.width/W,r.height/H),ox=(r.width-W*sc)/2,oy=(r.height-H*sc)/2;aim.x=(e.clientX-r.left-ox)/sc+cam;aim.y=(e.clientY-r.top-oy)/sc;aim.on=1;aim.t=clock}
cv.addEventListener('pointerdown',e=>{aimAt(e);if(state!=='play'){press('use');setTimeout(()=>rel('use'),120);return}if(e.pointerType==='mouse'){const a=e.button===2?'thr':(e.button===1||e.shiftKey)?'ovr':'atk';PA[e.pointerId]=a;e.preventDefault();press(a)}});
addEventListener('pointerup',e=>{const a=PA[e.pointerId];if(a){rel(a);delete PA[e.pointerId]}});cv.addEventListener('pointermove',aimAt);
document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden&&state==='play')toggleInv()});document.addEventListener('contextmenu',e=>e.preventDefault());
requestAnimationFrame(frame);
</script>
